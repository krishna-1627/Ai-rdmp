<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Engineer Roadmap</title>
<style>
  :root{
    --cream: #F5F0E8;
    --paper: #FBF8F3;
    --card: #FFFFFF;
    --ink: #2B2825;
    --ink-soft: #6E6659;
    --border: #E6DFD1;
    --accent: #C96442;
    --accent-soft: #F0DDD3;
    --green: #6F8F63;
    --green-soft: #E3EBDE;
    --locked: #C7C0B2;
    --locked-bg: #EFEBE2;
    --shadow: 0 1px 2px rgba(43,40,37,0.06);
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:40px 20px 100px;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:32px;
    flex-wrap:wrap;
  }
  .title-block h1{
    font-family:Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size:30px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .title-block p{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:40ch;
    line-height:1.5;
  }
  .ring-wrap{
    display:flex;
    align-items:center;
    gap:14px;
    flex-shrink:0;
  }
  .ring{ position:relative; width:70px; height:70px; }
  .ring svg{ transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--border); stroke-width:6.5; }
  .ring-fill{ fill:none; stroke:var(--accent); stroke-width:6.5; stroke-linecap:round; transition:stroke-dashoffset .5s ease; }
  .ring-pct{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:600;
  }
  .ring-label{ font-size:12.5px; color:var(--ink-soft); line-height:1.4; }
  .ring-label strong{ color:var(--ink); font-weight:600; }

  .focus-card{
    background:var(--card);
    border:1px solid var(--border);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:36px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .focus-card:hover{ background:var(--paper); }
  .focus-eyebrow{ font-size:11.5px; color:var(--accent); font-weight:600; margin-bottom:5px; letter-spacing:.02em; }
  .focus-title{ font-size:16px; font-weight:600; margin:0 0 3px; }
  .focus-sub{ font-size:13px; color:var(--ink-soft); margin:0; }
  .focus-card.done{ border-left-color:var(--green); }
  .focus-card.done .focus-eyebrow{ color:var(--green); }

  /* ROADMAP TREE */
  .roadmap{
    position:relative;
    padding-left:54px;
  }
  .roadmap::before{
    content:'';
    position:absolute;
    left:23px;
    top:16px;
    bottom:16px;
    width:2px;
    background:var(--border);
  }
  .step{
    position:relative;
    margin-bottom:14px;
  }
  .step-node{
    position:absolute;
    left:-54px;
    top:12px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--locked-bg);
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12.5px;
    font-weight:700;
    border:3px solid var(--cream);
    z-index:1;
  }
  .step.current .step-node{ background:var(--accent); color:#fff; }
  .step.complete .step-node{ background:var(--green); color:#fff; }

  .step-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    transition:border-color .15s ease;
  }
  .step-box:hover{ background:var(--paper); }
  .step.current .step-box{ border-color:var(--accent); }
  .step.complete .step-box{ border-color:var(--green-soft); }

  .step-info{ flex:1; min-width:0; }
  .step-name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px; }
  .step-name{ font-size:15px; font-weight:600; margin:0; }
  .step-duration{
    font-size:10.5px;
    font-weight:600;
    color:var(--accent);
    background:var(--accent-soft);
    padding:2px 8px;
    border-radius:20px;
    white-space:nowrap;
    letter-spacing:.01em;
  }
  .step.complete .step-duration{ color:var(--green); background:var(--green-soft); }
  .step-progress-row{ display:flex; align-items:center; gap:8px; }
  .step-bar{ flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; max-width:140px; }
  .step-bar-fill{ height:100%; background:var(--accent); border-radius:3px; transition:width .3s ease; }
  .step.complete .step-bar-fill{ background:var(--green); }
  .step-count{ font-size:11px; color:var(--ink-soft); white-space:nowrap; }

  .chevron{ width:15px; height:15px; flex-shrink:0; color:var(--ink-soft); transition:transform .2s ease; }
  .step.open .chevron{ transform:rotate(180deg); }

  .sub-panel{
    display:none;
    margin-top:8px;
    margin-left:4px;
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:10px;
    padding:6px 10px;
  }
  .step.open .sub-panel{ display:block; }

  .sub-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 6px;
    border-radius:6px;
    font-size:13.5px;
    cursor:pointer;
  }
  .sub-item:not(:last-child){ border-bottom:1px solid var(--border); }
  .sub-item:hover{ background:var(--card); }
  .sub-item.locked{ cursor:default; opacity:.5; }
  .sub-item.locked:hover{ background:none; }

  .box{
    width:17px; height:17px;
    border-radius:5px;
    border:1.5px solid var(--locked);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--card);
    transition:background .15s ease, border-color .15s ease;
  }
  .sub-item.current .box{ border-color:var(--accent); }
  .sub-item.done .box{ background:var(--green); border-color:var(--green); }
  .box svg{ width:11px; height:11px; opacity:0; transition:opacity .1s ease; }
  .sub-item.done .box svg{ opacity:1; }

  .sub-name{ color:var(--ink); }
  .sub-item.locked .sub-name{ color:var(--ink-soft); }
  .sub-item.current .sub-name{ font-weight:600; }

  footer.bottom{
    margin-top:28px;
    padding-left:54px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .reset-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--ink-soft);
    padding:7px 14px;
    border-radius:7px;
    font-size:12px;
    cursor:pointer;
  }
  .reset-btn:hover{ background:var(--card); color:var(--ink); }

  .loading{ padding:60px 0; text-align:center; color:var(--ink-soft); font-size:14px; }

  @media (max-width:520px){
    .wrap{ padding:24px 14px 80px; }
    .title-block h1{ font-size:24px; }
    .title-block p{ font-size:13px; max-width:32ch; }
    header.top{ gap:14px; margin-bottom:24px; }
    .ring{ width:58px; height:58px; }
    .ring-pct{ font-size:13px; }
    .ring-label{ font-size:11.5px; }
    .focus-card{ padding:14px; margin-bottom:26px; }
    .focus-title{ font-size:14.5px; }
    .roadmap{ padding-left:38px; }
    .roadmap::before{ left:15px; }
    .step-node{ left:-38px; width:24px; height:24px; font-size:11px; border-width:2px; top:14px; }
    .step-box{ padding:12px; gap:8px; }
    .step-name{ font-size:14px; }
    .step-duration{ font-size:10px; padding:2px 7px; }
    .step-bar{ max-width:90px; }
    .sub-panel{ margin-left:0; padding:4px 8px; }
    .sub-item{ padding:11px 4px; font-size:13px; gap:9px; }
    .box{ width:19px; height:19px; }
    footer.bottom{ padding-left:38px; flex-direction:column; align-items:flex-start; gap:10px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading your roadmap…</div>
</div>

<script>
const STORAGE_KEY = "ai-eng-roadmap-progress-v1";

const MODULES = [
  { id:"python", name:"Python Fundamentals", duration:"Weeks 1–3", subs:[
    {id:"py-vars", name:"Variables, Data Types & Conditionals"},
    {id:"py-loops", name:"Loops & Control Flow"},
    {id:"py-funcs", name:"Functions"},
    {id:"py-oop", name:"OOP Basics (Classes & Objects)"},
    {id:"py-errors", name:"Error Handling (try/except)"},
    {id:"py-files", name:"File Handling & JSON"},
    {id:"py-apis", name:"Working with APIs (requests library)"},
  ]},
  { id:"git", name:"Git & GitHub", duration:"Week 3", subs:[
    {id:"git-basics", name:"Init, Commit, Status"},
    {id:"git-branch", name:"Branching & Merging"},
    {id:"git-remote", name:"Push & Pull (Remote Repos)"},
    {id:"git-repo", name:"Setting Up a Clean Repo"},
    {id:"git-readme", name:"Writing a Good README"},
  ]},
  { id:"intro", name:"AI Engineer Introduction", duration:"Week 4", subs:[
    {id:"intro-what", name:"What is an AI Engineer?"},
    {id:"intro-vs-ml", name:"AI Engineer vs ML Engineer"},
    {id:"intro-roles", name:"Roles & Responsibilities"},
    {id:"intro-impact", name:"Impact on Product Development"},
    {id:"intro-agi", name:"AI vs AGI"},
    {id:"intro-terms", name:"Common Terminology"},
  ]},
  { id:"llm-core", name:"How LLMs Work", duration:"Week 4", subs:[
    {id:"llm-tokens", name:"Tokens & Tokenization"},
    {id:"llm-context", name:"Context Window"},
    {id:"llm-embed", name:"Embeddings (Concept)"},
    {id:"llm-inference", name:"Inference"},
    {id:"llm-training", name:"Training Basics"},
    {id:"llm-sampling", name:"Sampling Params (Temp, Top-K, Top-P)"},
  ]},
  { id:"pretrained", name:"Pre-trained & Popular AI Models", duration:"Week 5", subs:[
    {id:"pt-using", name:"Using Pre-trained Models"},
    {id:"pt-benefits", name:"Benefits & Limitations"},
    {id:"pt-openai", name:"OpenAI Models"},
    {id:"pt-claude", name:"Anthropic's Claude"},
    {id:"pt-gemini", name:"Google's Gemini"},
    {id:"pt-others", name:"Azure AI, AWS Sagemaker, Mistral, Cohere"},
  ]},
  { id:"openai-platform", name:"OpenAI Platform & Managing Tokens", duration:"Week 6", subs:[
    {id:"op-chat", name:"Chat Completions API"},
    {id:"op-prompts", name:"Writing Prompts & Playground"},
    {id:"op-finetune", name:"Fine-tuning Basics"},
    {id:"op-tokens", name:"Token Counting & Max Tokens"},
    {id:"op-pricing", name:"Pricing Considerations"},
  ]},
  { id:"prompting", name:"Prompt Engineering", duration:"Weeks 6–7", subs:[
    {id:"pe-anatomy", name:"Prompt Anatomy"},
    {id:"pe-shot", name:"Zero-Shot & Few-Shot"},
    {id:"pe-cot", name:"Chain-of-Thought"},
    {id:"pe-system", name:"System Prompts"},
    {id:"pe-func", name:"Function Calling"},
  ]},
  { id:"sql", name:"SQL Basics", duration:"Week 7", subs:[
    {id:"sql-select", name:"SELECT & WHERE"},
    {id:"sql-join", name:"JOINs"},
    {id:"sql-group", name:"GROUP BY & Aggregates"},
    {id:"sql-sub", name:"Subqueries"},
    {id:"sql-concepts", name:"Database Concepts"},
  ]},
  { id:"dsa", name:"Basic DSA", duration:"Week 7", subs:[
    {id:"dsa-arr", name:"Arrays & Strings"},
    {id:"dsa-sort", name:"Sorting & Searching"},
    {id:"dsa-practice", name:"Easy Problem Solving"},
    {id:"dsa-complexity", name:"Time Complexity Basics"},
  ]},
  { id:"math", name:"Math & Stats for AI", duration:"Week 8", subs:[
    {id:"math-stats", name:"Mean, Variance & Distributions"},
    {id:"math-prob", name:"Probability Basics"},
    {id:"math-linalg", name:"Vectors & Matrices (Intuition)"},
  ]},
  { id:"opensource", name:"Open Source AI", duration:"Week 8", subs:[
    {id:"os-vs", name:"Open vs Closed Source Models"},
    {id:"os-hf", name:"Hugging Face Hub & Tasks"},
    {id:"os-find", name:"Finding Open Source Models"},
    {id:"os-ollama", name:"Ollama & Local Inference"},
  ]},
  { id:"vectors", name:"Embeddings & Vector Databases", duration:"Week 9", subs:[
    {id:"vec-what", name:"What Are Embeddings"},
    {id:"vec-usecases", name:"Use Cases (Search, Recs, Anomaly Detection)"},
    {id:"vec-models", name:"Embedding Models (OpenAI, Sentence Transformers)"},
    {id:"vec-db", name:"Vector DB Basics (Chroma/Pinecone)"},
    {id:"vec-search", name:"Indexing & Similarity Search"},
  ]},
  { id:"rag", name:"RAG (Retrieval-Augmented Gen.)", duration:"Weeks 10–11", subs:[
    {id:"rag-usecases", name:"RAG Usecases & RAG vs Fine-tuning"},
    {id:"rag-chunk", name:"Chunking Strategies"},
    {id:"rag-embed", name:"Embedding & Storage"},
    {id:"rag-retrieve", name:"Retrieval Process"},
    {id:"rag-generate", name:"Generation Step"},
    {id:"rag-framework", name:"LangChain or LlamaIndex Basics"},
  ]},
  { id:"agents", name:"AI Agents", duration:"Week 12", subs:[
    {id:"agent-usecases", name:"Agent Usecases"},
    {id:"agent-react", name:"ReAct Prompting"},
    {id:"agent-tools", name:"Tools & Function Calling"},
    {id:"agent-build", name:"Building Agents (Manual / OpenAI Tools)"},
  ]},
  { id:"safety", name:"AI Safety & Ethics", duration:"Week 13", subs:[
    {id:"safety-injection", name:"Prompt Injection Attacks"},
    {id:"safety-bias", name:"Bias & Fairness"},
    {id:"safety-privacy", name:"Security & Privacy Concerns"},
    {id:"safety-adversarial", name:"Adversarial Testing & Moderation APIs"},
    {id:"safety-best", name:"Safety Best Practices"},
  ]},
  { id:"multimodal", name:"Multimodal AI", duration:"Week 14", subs:[
    {id:"mm-image", name:"Image Understanding & Generation"},
    {id:"mm-video", name:"Video Understanding"},
    {id:"mm-audio", name:"Audio Processing (STT/TTS)"},
    {id:"mm-apis", name:"Multimodal APIs (Vision, DALL-E, Whisper)"},
  ]},
  { id:"devtools", name:"Development Tools", duration:"Week 14", subs:[
    {id:"dt-editors", name:"AI Code Editors"},
    {id:"dt-completion", name:"Code Completion Tools"},
  ]},
];

const SEQUENCE = [];
MODULES.forEach(m => m.subs.forEach(s => SEQUENCE.push({moduleId:m.id, subId:s.id})));

let progress = {};
let openModule = null;

function checkIcon(){
  return '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2L4.6 9L10 3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function chevronIcon(){
  return '<svg viewBox="0 0 16 16" fill="none" class="chevron"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function currentSeqIndex(){
  for(let i=0;i<SEQUENCE.length;i++){
    if(!progress[SEQUENCE[i].subId]) return i;
  }
  return SEQUENCE.length;
}

function render(){
  const app = document.getElementById('app');
  const curIdx = currentSeqIndex();
  const totalDone = Object.values(progress).filter(Boolean).length;
  const total = SEQUENCE.length;
  const pct = Math.round((totalDone/total)*100);

  const allDone = curIdx >= SEQUENCE.length;
  const curItem = !allDone ? SEQUENCE[curIdx] : null;
  const curModule = curItem ? MODULES.find(m=>m.id===curItem.moduleId) : null;
  const curSub = curItem ? curModule.subs.find(s=>s.id===curItem.subId) : null;

  const circumference = 2*Math.PI*30;
  const dashOffset = circumference * (1 - pct/100);

  let html = '';
  html += `
    <header class="top">
      <div class="title-block">
        <h1>AI Engineer Roadmap</h1>
        <p>Your path from scratch to fresher-ready, step by step.</p>
      </div>
      <div class="ring-wrap">
        <div class="ring">
          <svg width="70" height="70" viewBox="0 0 70 70">
            <circle class="ring-track" cx="35" cy="35" r="30"/>
            <circle class="ring-fill" cx="35" cy="35" r="30"
              stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"/>
          </svg>
          <div class="ring-pct">${pct}%</div>
        </div>
        <div class="ring-label"><strong>${totalDone}</strong> of ${total}<br>topics</div>
      </div>
    </header>
  `;

  if(allDone){
    html += `
      <div class="focus-card done">
        <div class="focus-eyebrow">ALL DONE</div>
        <div class="focus-title">You've completed the full roadmap 🎉</div>
        <div class="focus-sub">Time to focus fully on projects, interview prep, and applying.</div>
      </div>
    `;
  } else {
    html += `
      <div class="focus-card" onclick="jumpToCurrent()">
        <div class="focus-eyebrow">CURRENTLY LEARNING</div>
        <div class="focus-title">${curSub.name}</div>
        <div class="focus-sub">${curModule.name} — click to jump there</div>
      </div>
    `;
  }

  html += `<div class="roadmap">`;
  MODULES.forEach((m, mi) => {
    const doneCount = m.subs.filter(s=>progress[s.id]).length;
    const modPct = Math.round((doneCount/m.subs.length)*100);
    const isComplete = doneCount === m.subs.length;
    const containsCurrent = curItem && curItem.moduleId === m.id;
    const isOpen = openModule === m.id;

    let stateClass = '';
    if(isComplete) stateClass = 'complete';
    else if(containsCurrent) stateClass = 'current';

    html += `
      <div class="step ${stateClass} ${isOpen?'open':''}">
        <div class="step-node">${isComplete ? checkIcon() : (mi+1)}</div>
        <div class="step-box" onclick="toggleModule('${m.id}')">
          <div class="step-info">
            <div class="step-name-row">
              <p class="step-name">${m.name}</p>
              <span class="step-duration">${m.duration}</span>
            </div>
            <div class="step-progress-row">
              <div class="step-bar"><div class="step-bar-fill" style="width:${modPct}%"></div></div>
              <span class="step-count">${doneCount}/${m.subs.length}</span>
            </div>
          </div>
          ${chevronIcon()}
        </div>
        <div class="sub-panel">
    `;

    m.subs.forEach(s => {
      const seqIdx = SEQUENCE.findIndex(x=>x.subId===s.id);
      const isDone = !!progress[s.id];
      const isCurrent = seqIdx === curIdx;
      const isLocked = !isDone && seqIdx > curIdx;
      const isClickable = isDone || isCurrent;
      let cls = 'sub-item';
      if(isDone) cls += ' done';
      if(isCurrent) cls += ' current';
      if(isLocked) cls += ' locked';

      html += `
        <div class="${cls}" ${isClickable ? `onclick="toggleSub('${s.id}')"` : ''}>
          <div class="box">${checkIcon()}</div>
          <span class="sub-name">${s.name}</span>
        </div>
      `;
    });

    html += `</div></div>`;
  });
  html += `</div>`;

  html += `
    <footer class="bottom">
      <span>Progress saves automatically.</span>
      <button class="reset-btn" onclick="resetProgress()">Reset all progress</button>
    </footer>
  `;

  app.innerHTML = html;
}

function toggleModule(id){
  openModule = (openModule === id) ? null : id;
  render();
}

function jumpToCurrent(){
  const idx = currentSeqIndex();
  if(idx < SEQUENCE.length){
    openModule = SEQUENCE[idx].moduleId;
    render();
    document.querySelector('.step.current')?.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

async function toggleSub(subId){
  progress[subId] = !progress[subId];
  render();
  try{
    const res = await window.storage.set(STORAGE_KEY, JSON.stringify(progress), false);
    if(!res){ console.error('Save failed'); }
  }catch(e){
    console.error('Storage error', e);
  }
}

async function resetProgress(){
  if(!confirm('Reset all progress? This cannot be undone.')) return;
  progress = {};
  openModule = null;
  render();
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(progress), false);
  }catch(e){
    console.error('Storage error', e);
  }
}

async function init(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      progress = JSON.parse(res.value);
    }
  }catch(e){
    progress = {};
  }
  const idx = currentSeqIndex();
  openModule = idx < SEQUENCE.length ? SEQUENCE[idx].moduleId : MODULES[0].id;
  render();
}

init();
</script>
</body>
</html>
